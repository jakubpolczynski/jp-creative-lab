<!doctype html><html><head><meta charset="utf-8"><title>ASCII converter regression</title></head><body><pre id="result">Testing…</pre><iframe title="Converter under test" width="1000" height="700"></iframe><script type="module">

  remix.click();
  const colorOriginal=preview.innerHTML;
  for(const [id,value] of [['#remix-contrast','1.5'],['#remix-saturation','0'],['#remix-edges','100'],['#remix-palette','amber'],['#remix-ramp','01 ']]){

  }

  check('Background edit changes preview and exported background',w.getComputedStyle(preview).backgroundColor==='rgb(18, 52, 86)'&&(await(await fetch(download.href)).text()).includes('background:#123456'));
  const widthControl=d.querySelector('#remix-width');for(const value of [40,240,90]){widthControl.value=value;widthControl.dispatchEvent(new w.Event('input',{bubbles:true}));}
  await new Promise(r=>setTimeout(r,250));check('Rapid edits retain the latest setting',preview.textContent.split('\n')[0].length===90);
  d.querySelector('#remix-reset').click();await new Promise(r=>setTimeout(r,150));remix.click();
 }
 const format=d.querySelector('#ascii-format');
 check('HTML PNG JPG TXT export choices exist',!!format&&['html','png','jpg','txt'].every(value=>[...format.options].some(o=>o.value===value)));
 if(format){
  for(const value of ['txt','png','jpg']){
   format.value=value;format.dispatchEvent(new w.Event('change',{bubbles:true}));
   for(let i=0;i<150;i++){if(download.getAttribute('href')&&download.download==='kolory-ascii.'+value)break;await new Promise(r=>setTimeout(r,30))}
   const blob=await(await fetch(download.href)).blob();
   if(value==='txt')check('TXT export matches ASCII characters',await blob.text()===preview.textContent);
   else{
    const bitmap=await createImageBitmap(blob),canvas=document.createElement('canvas');canvas.width=bitmap.width;canvas.height=bitmap.height;
    const ctx=canvas.getContext('2d');ctx.drawImage(bitmap,0,0);const pixels=ctx.getImageData(0,0,canvas.width,canvas.height).data;
    let red=0,blue=0,background=0;for(let i=0;i<pixels.length;i+=4){if(pixels[i]>150&&pixels[i+1]<90&&pixels[i+2]<90)red++;if(pixels[i+2]>150&&pixels[i]<90)blue++;if(pixels[i]>240&&pixels[i+1]>240&&pixels[i+2]>240)background++;}
    check(value.toUpperCase()+' export is a large colored ASCII image',blob.type===(value==='png'?'image/png':'image/jpeg')&&bitmap.width>1200&&red>100&&blue>100&&background>red+blue,{width:bitmap.width,height:bitmap.height,red,blue});bitmap.close();
   }
  }
  format.value='html';format.dispatchEvent(new w.Event('change',{bubbles:true}));await new Promise(r=>setTimeout(r,40));
 }
 choose(png);await wait('ready');

 check('Pasting a screenshot converts it and enables download',pasteEvent.defaultPrevented&&download.download==='schowek-ascii.html'&&root.dataset.state==='ready',{prevented:pasteEvent.defaultPrevented,downloadName:download.download,state:root.dataset.state,open:d.querySelector('#monitor-app').dataset.open,items:[...pasteEvent.clipboardData.items].map(i=>({kind:i.kind,type:i.type,name:i.getAsFile()?.name}))});
 const pasteButton=d.querySelector('#ascii-paste');
 const clipboard={calls:0,async read(){this.calls++;return [new w.ClipboardItem({'image/png':png})]}};
 Object.defineProperty(w.navigator,'clipboard',{configurable:true,value:clipboard});
 pasteButton?.click();await new Promise(r=>setTimeout(r,100));

 clipboard.read=async()=>{throw new w.DOMException('Denied','NotAllowedError')};pasteButton.click();await new Promise(r=>setTimeout(r,30));
 check('Clipboard permission denial offers Ctrl+V without losing result',d.querySelector('#ascii-status').textContent.includes('Ctrl + V')&&!preview.hidden&&!download.hidden);
 clipboard.read=async()=>[];pasteButton.click();await new Promise(r=>setTimeout(r,30));
 check('Empty clipboard gives actionable message',d.querySelector('#ascii-status').textContent.includes('Brak obrazu'));
 for(const mode of ['denied','unavailable','empty']){
  let release;
  const gate=new Promise(resolve=>{release=resolve});
  const file=new w.File([await coloredSvg.text()],'pending-'+mode+'.svg',{type:'image/svg+xml'});
  file.text=async()=>{await gate;return w.File.prototype.text.call(file)};
  clipboard.read=mode==='unavailable'?undefined:async()=>{if(mode==='denied')throw new w.DOMException('Denied','NotAllowedError');return []};
  choose(file);
  if(root.dataset.state!=='loading')throw Error('Upload did not enter loading before clipboard '+mode);
  pasteButton.click();await new Promise(r=>setTimeout(r,30));
  const revoke=w.URL.revokeObjectURL;
  let decoded;const decoding=new Promise(resolve=>{decoded=resolve});
  w.URL.revokeObjectURL=url=>{revoke.call(w.URL,url);decoded()};
  try{release();await decoding;await new Promise(r=>setTimeout(r,30))}finally{w.URL.revokeObjectURL=revoke}
  check('Clipboard '+mode+' does not cancel a pending real upload',root.dataset.state==='ready'&&!preview.hidden&&!download.hidden&&download.download==='pending-'+mode+'-ascii.html'&&d.querySelector('#ascii-status').textContent==='',{state:root.dataset.state,status:d.querySelector('#ascii-status').textContent,downloadName:download.download});
 }
 function deferred(){let resolve,reject;const promise=new Promise((yes,no)=>{resolve=yes;reject=no});return {promise,resolve,reject}}
 for(const outcome of ['image','blob','empty','denied']){
  const pending=deferred(),readingBlob=deferred();
  clipboard.read=()=>outcome==='blob'?Promise.resolve([{types:['image/png'],getType(){readingBlob.resolve();return pending.promise}}]):pending.promise;
  pasteButton.click();if(outcome==='blob')await readingBlob.promise;
  choose(png);await wait('ready');const revision=preview.dataset.revision;
  if(outcome==='denied')pending.reject(new w.DOMException('Denied','NotAllowedError'));
  else pending.resolve(outcome==='blob'?png:outcome==='empty'?[]:[new w.ClipboardItem({'image/png':png})]);
  await new Promise(r=>setTimeout(r,30));
  check('Late clipboard '+outcome+' cannot overwrite a newer upload',root.dataset.state==='ready'&&download.download==='face-ascii.html'&&preview.dataset.revision===revision&&d.querySelector('#ascii-status').textContent==='');
 }
 for(const newer of ['image','empty','unavailable']){
  const first=deferred();clipboard.read=()=>first.promise;pasteButton.click();
  clipboard.read=newer==='unavailable'?undefined:async()=>newer==='empty'?[]:[new w.ClipboardItem({'image/svg+xml':coloredSvg})];
  pasteButton.click();await new Promise(r=>setTimeout(r,60));
  const revision=preview.dataset.revision,message=d.querySelector('#ascii-status').textContent;
  first.resolve([new w.ClipboardItem({'image/png':png})]);await new Promise(r=>setTimeout(r,30));

 }
 const plain=new w.DataTransfer();plain.setData('text/plain','not an image');const textPaste=new w.ClipboardEvent('paste',{bubbles:true,cancelable:true,clipboardData:plain});d.dispatchEvent(textPaste);
 check('Normal text paste is not intercepted',!textPaste.defaultPrevented);

 const data=new w.DataTransfer();data.items.add(svg);drop.dispatchEvent(new w.DragEvent('drop',{bubbles:true,cancelable:true,dataTransfer:data}));await wait('ready');
